<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TNPSC Master" />
    <meta name="description" content="TNPSC Master: Group 1 preparation with daily quiz, SCERT study material, Tamil Nadu current affairs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <title>TNPSC Master</title>
    <!-- Launch screen: shown instantly (before the app code loads), removed by main.tsx. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #fafbfc; transition: opacity 0.35s ease;
      }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #splash { background: #0d1117; } }
      :root[data-theme='dark'] #splash { background: #0d1117; }
      #splash .stage { perspective: 900px; }
      #splash img { width: 168px; height: 168px; object-fit: contain; animation: splash-spin 1.4s ease-in-out infinite; }
      #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(30, 58, 138, 0.12); overflow: hidden; }
      #splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: #d4a017;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      /* Spins left to right, like a coin turning. */
      @keyframes splash-spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="stage"><img src="/logo-256.png" alt="" /></div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
